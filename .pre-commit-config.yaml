# Local quality gates (CLAUDE.md §9). Install once, per clone:
#   pre-commit install && pre-commit install --hook-type pre-push
#
# SETUP: pin `rev`s to current versions, and replace the two {{...}} `local` hooks with the
# project's real lint/format and test commands. Keep the secret scan and private-key hooks —
# they enforce Rule C and must not be removed.

repos:
  # --- Secret scanning (Rule C — do not remove) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2   # SETUP: pin to the current gitleaks release
    hooks:
      - id: gitleaks

  # --- Basic hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0    # SETUP: pin to the current release
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files

  # --- Project gates (replace the entries below with real commands) ---
  - repo: local
    hooks:
      # Lint + format on COMMIT.
      - id: lint-format
        name: lint & format ({{LINT_FORMAT_TOOL}})
        entry: {{LINT_FORMAT_TOOL}}   # SETUP: e.g. `ruff check --fix` / `eslint --fix`
        language: system
        types: [text]
        stages: [pre-commit]

      # Full test suite on PUSH (with the coverage floor from CLAUDE.md §4).
      - id: tests
        name: test suite ({{TEST_FRAMEWORK}})
        entry: {{TEST_FRAMEWORK}}      # SETUP: e.g. `pytest --cov --cov-fail-under={{COVERAGE_FLOOR}}`
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # The agent usage guard's own tests (tools/agent; Python standard library only).
      - id: tests-agent-guard
        name: tools/agent guard unit tests
        entry: python3 -I -m unittest discover -s tools/agent
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
